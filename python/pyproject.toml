[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assemblage"
version = "0.1.0"
description = "Companion Python graph and numerical simulation engine for assemblage combinatorics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "hypothesis>=6.80.0",
]
